<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports - NSBM NewsDesk</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Link to the stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="logo">
            <img src="https://via.placeholder.com/150x50/ffffff/000000?text=NSBM+LOGO" alt="NSBM Logo">
        </div>
        
        <nav class="main-nav">
            <ul>
                <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fas fa-search"></i> Explore & Search</a></li>
                <li><a href="#"><i class="far fa-paper-plane"></i> Submit News</a></li>
            </ul>
        </nav>

        <div class="header-right">
            <button class="btn-breaking" id="breakingBtn">
                <i class="far fa-newspaper"></i> BREAKING NEWS
            </button>
            <a href="#" class="login-link">Login / Register</a>
        </div>
    </header>

    <!-- Main Content Area with Blurred Background -->
    <main class="content-wrapper">
        <div class="container">
            
            <section class="news-section">
                <!-- Section Title updated to Sports -->
                <h1 class="section-title">Sports</h1>
                
                <!-- JS will inject the sports cards here -->
                <div class="news-grid" id="sports-grid">
                    <p class="loading-msg">Loading sports news...</p>
                </div>
            </section>

            <!-- Call to Action Banner -->
            <section class="cta-section">
                <div class="cta-box">
                    <h2>Have a Story to share?</h2>
                    <p>Submit your news article or announcement and get it published on NSBM NewsDesk.</p>
                    <button class="btn-submit" id="submitNewsBtn">Submit News</button>
                </div>
            </section>

        </div>
    </main>

    <!-- Link to the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
