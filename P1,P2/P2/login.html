<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - NSBM NewsDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html"><img src="images/logo.png" alt="NSBM Green University Town" class="nav-logo"></a>
  <nav class="nav-links">
    <a href="index.html">&#8962;<br>Home</a>
    <a href="search.html">&#128269;<br>Explore &amp; Search</a>
    <a href="#">&#9992;<br>Submit News</a>
  </nav>
  <a href="#" class="breaking">&#9776; BREAKING NEWS</a>
  <a href="login.html" class="login-link">&#10142; Login / Register</a>
</header>

<main class="login-bg">

  <section class="welcome">
    <h1>Welcome Back</h1>
    <p>Sign in to NSBM NewsDesk</p>
  </section>

  <section class="login-card">
    <img src="images/logo-card.png" alt="NSBM logo" class="card-logo">
    <div class="avatar"></div>

    <form method="post" action="php/login.php" onsubmit="return checkLogin()">
      <label for="email">University Email</label>
      <input type="email" id="email" name="email" placeholder="student@students.nsbm.ac.lk">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="********">

      <div class="row">
        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <!-- Messages from JavaScript or PHP appear here -->
      <p id="jsError" class="error"></p>

      <button type="submit" class="sign-btn">Sign In</button>
    </form>

    <p class="no-account">No account?<br><a href="#">Register</a></p>
  </section>

</main>

<script src="js/script.js"></script>
</body>
</html>
