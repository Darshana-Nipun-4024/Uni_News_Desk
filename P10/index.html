<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSBM NewsDesk</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="logo">
            <img src="nsbmlogo.png" alt="NSBM Logo" style="height: 50px;">
        </div>
        
        <nav class="main-nav">
            <ul>
                <li><a href="P1,P2,P3,P4\P1\index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fas fa-search"></i> Explore & Search</a></li>
                <li><a href="#"><i class="far fa-paper-plane"></i> Submit News</a></li>
            </ul>
        </nav>

        <div class="header-right">
            <button class="btn-breaking" id="breakingNewsBtn">
                <i class="far fa-newspaper"></i> BREAKING NEWS
            </button>
            <a href="#" class="login-link">Login / Register</a>
        </div>
    </header>

    <!-- Main Content Area with Blurred Background -->
    <main class="content-wrapper">
        <div class="container">
            
            <section class="news-section">
                <h1 class="section-title">General</h1>
                
                <!-- JS will inject the news cards into this empty div -->
                <div class="news-grid" id="news-container">
                    <!-- Loading text (disappears when data loads) -->
                    <p>Loading news...</p>
                </div>
            </section>

            <!-- Call to Action Section -->
            <section class="cta-section">
                <div class="cta-box">
                    <h2>Have a Story to share?</h2>
                    <p>Submit your news article or announcement and get it published on NSBM NewsDesk.</p>
                    <button class="btn-submit" id="submitStoryBtn">Submit News</button>
                </div>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
